name: 构建并部署

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install fonttools brotli

      - uses: actions/cache@v4
        with:
          path: .fonts-cache
          key: fonts-v1

      - name: 构建线上版
        run: python tools/build-site.py

      - name: 检查 HTML 结构
        run: python tools/check-html.py dist/index.html

      - name: 部署到 Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::仓库还没配 Cloudflare 的 secrets,这次只构建不部署"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name hongloumeng --branch main --commit-dirty=true
          echo "deployed=1" >> "$GITHUB_OUTPUT"

      - name: 线上自检
        if: steps.deploy.outputs.deployed == '1'
        run: |
          page=$(curl -fsS --retry 3 --retry-delay 5 https://honglou.wolfholo.com/)
          for m in '红楼梦人物关系图谱' '关系星图' '随贾政一行游园' '百二十回'; do
            grep -q "$m" <<< "$page" || { echo "::error::线上页面缺少「$m」"; exit 1; }
          done
          if grep -q 'fonts.googleapis.com' <<< "$page"; then echo "::error::线上页面仍引用 Google Fonts"; exit 1; fi
          for f in $(grep -oE '/fonts/[a-z]+-[0-9a-f]+\.woff2' <<< "$page" | sort -u); do
            curl -fsS -o /dev/null "https://honglou.wolfholo.com$f" || { echo "::error::$f 取不到"; exit 1; }
          done
          echo "线上自检通过"
