name: 构建并部署

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install fonttools brotli

      - run: npm ci

      # 字体源文件和切好的分包都缓存起来；用到的字没变时 fonts.mjs 会直接跳过
      - uses: actions/cache@v4
        with:
          path: |
            .fonts-cache
            public/fonts
          key: fonts-v2-${{ github.sha }}
          restore-keys: fonts-v2-

      - name: 构建并自检
        run: npm run build

      - name: 部署到 Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::仓库还没配 Cloudflare 的 secrets，这次只构建不部署"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name hongloumeng --branch main --commit-dirty=true
          echo "deployed=1" >> "$GITHUB_OUTPUT"

      - name: 线上自检
        if: steps.deploy.outputs.deployed == '1'
        run: |
          base=https://honglou.wolfholo.com
          check() {
            page=$(curl -fsS --retry 3 --retry-delay 5 "$base$1") || { echo "::error::$1 打不开"; exit 1; }
            grep -q "$2" <<< "$page" || { echo "::error::$1 缺少「$2」"; exit 1; }
          }
          check / '红楼梦人物关系图谱'
          check /graph/ '关系总图'
          check /garden/ '题对额'
          check /chapters/1/ '甄士隐'
          curl -fsS -o /dev/null "$base/fonts/fonts.css" || { echo "::error::fonts.css 取不到"; exit 1; }
          echo "线上自检通过"
